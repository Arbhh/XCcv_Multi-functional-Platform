# 项目元数据（供 GitHub / 工具识别）。
# 运行环境以 requirements.txt 为准（含 torch 安装源说明），本文件不参与 pip 安装。
[project]
name = "xccv-multi-functional-platform"
version = "0.8.3"
description = "XCcv Multi-functional Platform：离线工业视觉平台（标注 / 训练 / 测试 / 部署服务 / 模型工具 / 流程图 / 缺陷样本合成）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Arbhh" }]
keywords = ["industrial-vision", "defect-detection", "yolo", "labelme", "pyqt5",
            "anomaly-detection", "ocr", "tensorrt", "fastapi", "inference-service"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Repository = "https://github.com/Arbhh/XCcv_Multi-functional-Platform"
Changelog = "https://github.com/Arbhh/XCcv_Multi-functional-Platform/blob/master/CHANGELOG.md"
